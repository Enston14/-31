<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Awesome Kanban Board</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        /* ============================================================
           СТИЛИ
           ============================================================ */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #2E5FA1;
            min-height: 100vh;
            color: #1a202c;
        }

        .navbar {
            background: #1a202c !important;
            padding: 10px 0 !important;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2) !important;
        }

        .navbar-brand {
            color: #ffffff !important;
            font-weight: 600 !important;
            font-size: 1rem !important;
        }

        .navbar .nav-link {
            color: rgba(255, 255, 255, 0.6) !important;
            font-size: 13px !important;
            padding: 4px 12px !important;
        }

        .navbar .nav-link:hover {
            color: #ffffff !important;
        }

        .navbar .nav-link.active {
            color: #ffffff !important;
        }

        .navbar .form-control {
            background: rgba(255, 255, 255, 0.08) !important;
            color: #ffffff !important;
            border: 1px solid rgba(255, 255, 255, 0.15) !important;
            border-radius: 4px !important;
            font-size: 13px !important;
            padding: 4px 10px !important;
            width: 120px !important;
            height: 32px !important;
        }

        .navbar .form-control::placeholder {
            color: rgba(255, 255, 255, 0.4) !important;
            font-size: 12px !important;
        }

        .navbar .form-control:focus {
            background: rgba(255, 255, 255, 0.12) !important;
            border-color: rgba(255, 255, 255, 0.3) !important;
            box-shadow: none !important;
        }

        .navbar .btn-outline-light {
            border-color: rgba(255, 255, 255, 0.2) !important;
            color: #ffffff !important;
            border-radius: 4px !important;
            font-size: 13px !important;
            padding: 4px 14px !important;
            height: 32px !important;
            transition: all 0.2s ease !important;
        }

        .navbar .btn-outline-light:hover {
            background: #ffffff !important;
            color: #1a202c !important;
            border-color: #ffffff !important;
        }

        .navbar .role-badge {
            color: rgba(255, 255, 255, 0.5);
            font-size: 11px;
            margin-left: 6px;
            background: rgba(255, 255, 255, 0.1);
            padding: 2px 8px;
            border-radius: 10px;
        }

        /* ===== USER MENU ===== */
        #user-menu-container {
            display: flex;
            align-items: center;
            position: relative;
            margin-left: 12px;
        }

        .user-menu-trigger {
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            padding: 2px 6px;
            border-radius: 16px;
            transition: background 0.2s ease;
            user-select: none;
        }

        .user-menu-trigger:hover {
            background: rgba(255, 255, 255, 0.08);
        }

        .user-avatar {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .user-avatar.admin {
            background: #e53e3e;
        }

        .user-avatar.user {
            background: #4299e1;
        }

        .avatar-text {
            color: #ffffff;
            font-weight: 600;
            font-size: 12px;
            text-transform: uppercase;
        }

        .user-name {
            color: rgba(255, 255, 255, 0.7);
            font-size: 13px;
            white-space: nowrap;
        }

        .dropdown-arrow {
            transition: transform 0.2s ease;
            flex-shrink: 0;
        }

        .dropdown-arrow.open {
            transform: rotate(180deg);
        }

        .user-dropdown-menu {
            display: none;
            position: absolute;
            top: calc(100% + 6px);
            right: 0;
            min-width: 180px;
            background: #ffffff;
            border-radius: 6px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15);
            padding: 4px 0;
            list-style: none;
            margin: 0;
            border: 1px solid #e2e8f0;
            z-index: 1000;
        }

        .user-dropdown-menu.active {
            display: block;
        }

        .user-dropdown-menu .dropdown-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 6px 14px;
            color: #1a202c;
            font-size: 13px;
            cursor: pointer;
            transition: background 0.15s ease;
            border: none;
            background: none;
            width: 100%;
            text-align: left;
            font-family: inherit;
        }

        .user-dropdown-menu .dropdown-item:hover {
            background: #edf2f7;
        }

        .user-dropdown-menu .dropdown-divider {
            height: 1px;
            margin: 4px 0;
            background: #e2e8f0;
        }

        .user-dropdown-menu .dropdown-item:last-child {
            color: #e53e3e;
        }

        .user-dropdown-menu .dropdown-item:last-child:hover {
            background: #fff5f5;
        }

        .user-dropdown-menu .dropdown-item .role-tag {
            font-size: 10px;
            color: #a0aec0;
            margin-left: auto;
        }

        /* ===== ЗАГОЛОВОК ДОСКИ ===== */
        .kanban-header {
            padding: 20px 0 10px 0;
        }

        .kanban-header h1 {
            color: #ffffff;
            font-weight: 700;
            font-size: 24px;
            margin-bottom: 4px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.2);
        }

        .stats {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.9);
        }

        .stat-item {
            display: flex;
            gap: 4px;
            background: rgba(255, 255, 255, 0.15);
            padding: 4px 14px;
            border-radius: 16px;
            backdrop-filter: blur(4px);
        }

        .stat-label {
            font-weight: 400;
        }

        .stat-value {
            font-weight: 600;
            color: #ffffff;
        }

        /* ===== КАНБАН-ДОСКА ===== */
        .kanban-board {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 14px;
            margin-top: 10px;
        }

        .kanban-column {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(8px);
            border-radius: 8px;
            padding: 12px 12px 10px;
            min-height: 350px;
            display: flex;
            flex-direction: column;
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
        }

        .kanban-column.drag-over {
            border-color: #4299e1;
            background: rgba(66, 153, 225, 0.05);
        }

        .column-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            padding-bottom: 6px;
            border-bottom: 1px solid #edf2f7;
        }

        .column-title {
            font-size: 12px;
            font-weight: 700;
            color: #1a202c;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin: 0;
        }

        .task-count {
            background: #edf2f7;
            color: #4a5568;
            padding: 0 8px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: 600;
            min-width: 18px;
            text-align: center;
        }

        .task-list {
            flex: 1;
            min-height: 150px;
            margin-bottom: 8px;
        }

        /* ===== КАРТОЧКИ ЗАДАЧ ===== */
        .task-card {
            padding: 4px 0;
            margin-bottom: 2px;
            cursor: grab;
            border-bottom: 1px solid #f7fafc;
            transition: all 0.2s ease;
        }

        .task-card:last-child {
            border-bottom: none;
        }

        .task-card:hover {
            background: rgba(66, 153, 225, 0.05);
        }

        .task-card.dragging {
            opacity: 0.5;
            cursor: grabbing;
        }

        .task-card-title {
            font-weight: 400;
            font-size: 13px;
            color: #1a202c;
            margin: 0;
        }

        .task-card-description {
            font-size: 12px;
            color: #a0aec0;
            margin: 0;
        }

        .task-card .task-author {
            font-size: 10px;
            color: #a0aec0;
            margin-left: 8px;
        }

        /* ===== КНОПКА + ADD CARD ===== */
        .column-footer {
            margin-top: auto;
            padding-top: 6px;
            border-top: 1px solid #edf2f7;
        }

        .add-task-btn {
            width: 100%;
            padding: 4px 0;
            background: transparent;
            color: #a0aec0;
            border: none;
            font-weight: 400;
            font-size: 13px;
            transition: all 0.2s ease;
            font-family: inherit;
            cursor: pointer;
            text-align: left;
        }

        .add-task-btn:not(:disabled):hover {
            color: #4299e1;
            background: #ebf8ff;
            border-radius: 3px;
            padding-left: 4px;
        }

        .add-task-btn:disabled {
            color: #cbd5e0;
            cursor: not-allowed;
        }

        .add-task-btn:disabled:hover {
            background: transparent;
            padding-left: 0;
        }

        /* ===== ПОЛЕ ВВОДА ===== */
        .task-input-wrapper {
            display: flex;
            gap: 4px;
            margin: 4px 0 6px 0;
            align-items: center;
        }

        .task-input-wrapper .task-input {
            flex: 1;
            border-radius: 4px;
            border: 1px solid #e2e8f0;
            padding: 4px 8px;
            font-size: 13px;
            font-family: inherit;
            height: 30px;
        }

        .task-input-wrapper .task-input:focus {
            border-color: #4299e1;
            outline: none;
            box-shadow: 0 0 0 2px rgba(66, 153, 225, 0.1);
        }

        .task-input-wrapper .task-submit-btn {
            background: #4299e1;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 4px 12px;
            font-size: 12px;
            height: 30px;
            transition: background 0.2s ease;
        }

        .task-input-wrapper .task-submit-btn:hover {
            background: #3182ce;
        }

        .task-input-wrapper .task-cancel-btn {
            background: #edf2f7;
            color: #4a5568;
            border: none;
            border-radius: 4px;
            padding: 4px 12px;
            font-size: 12px;
            height: 30px;
            transition: background 0.2s ease;
        }

        .task-input-wrapper .task-cancel-btn:hover {
            background: #e2e8f0;
        }

        /* ===== ДРОПДАУН ===== */
        .dropdown-wrapper {
            display: flex;
            gap: 4px;
            margin: 4px 0 6px 0;
            align-items: center;
            flex-wrap: wrap;
        }

        .dropdown-wrapper .task-dropdown {
            flex: 1;
            border-radius: 4px;
            border: 1px solid #e2e8f0;
            padding: 4px 6px;
            font-size: 13px;
            font-family: inherit;
            min-width: 100px;
            height: 30px;
            cursor: pointer;
        }

        .dropdown-wrapper .task-dropdown:focus {
            border-color: #4299e1;
            outline: none;
        }

        .dropdown-wrapper .task-submit-btn {
            background: #4299e1;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 4px 12px;
            font-size: 12px;
            height: 30px;
            transition: background 0.2s ease;
        }

        .dropdown-wrapper .task-submit-btn:hover:not(:disabled) {
            background: #3182ce;
        }

        .dropdown-wrapper .task-submit-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .dropdown-wrapper .task-cancel-btn {
            background: #edf2f7;
            color: #4a5568;
            border: none;
            border-radius: 4px;
            padding: 4px 12px;
            font-size: 12px;
            height: 30px;
            transition: background 0.2s ease;
        }

        .dropdown-wrapper .task-cancel-btn:hover {
            background: #e2e8f0;
        }

        /* ===== АДМИН ПАНЕЛЬ ===== */
        .admin-panel {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(8px);
            border-radius: 8px;
            padding: 16px;
            margin-top: 16px;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .admin-panel h3 {
            font-size: 16px;
            font-weight: 600;
            color: #1a202c;
            margin-bottom: 12px;
        }

        .admin-panel .user-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .admin-panel .user-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 12px;
            background: #f7fafc;
            border-radius: 4px;
            border: 1px solid #edf2f7;
        }

        .admin-panel .user-item .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .admin-panel .user-item .user-role-badge {
            font-size: 11px;
            padding: 2px 10px;
            border-radius: 10px;
            background: #edf2f7;
            color: #4a5568;
        }

        .admin-panel .user-item .user-role-badge.admin {
            background: #fed7d7;
            color: #e53e3e;
        }

        .admin-panel .user-item .user-role-badge.user {
            background: #bee3f8;
            color: #2b6cb0;
        }

        .admin-panel .user-item .btn-delete-user {
            background: none;
            border: none;
            color: #e53e3e;
            cursor: pointer;
            font-size: 14px;
            padding: 4px 8px;
            border-radius: 4px;
            transition: background 0.2s ease;
        }

        .admin-panel .user-item .btn-delete-user:hover {
            background: #fff5f5;
        }

        .admin-panel .add-user-form {
            display: flex;
            gap: 8px;
            margin-top: 12px;
            align-items: center;
            flex-wrap: wrap;
        }

        .admin-panel .add-user-form input {
            border-radius: 4px;
            border: 1px solid #e2e8f0;
            padding: 6px 10px;
            font-size: 13px;
            font-family: inherit;
            flex: 1;
            min-width: 120px;
        }

        .admin-panel .add-user-form input:focus {
            border-color: #4299e1;
            outline: none;
            box-shadow: 0 0 0 2px rgba(66, 153, 225, 0.1);
        }

        .admin-panel .add-user-form select {
            border-radius: 4px;
            border: 1px solid #e2e8f0;
            padding: 6px 10px;
            font-size: 13px;
            font-family: inherit;
            cursor: pointer;
        }

        .admin-panel .add-user-form select:focus {
            border-color: #4299e1;
            outline: none;
        }

        .admin-panel .add-user-form .btn-add-user {
            background: #4299e1;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 6px 16px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        .admin-panel .add-user-form .btn-add-user:hover {
            background: #3182ce;
        }

        /* ===== АДАПТИВ ===== */
        @media (max-width: 1024px) {
            .kanban-board {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 600px) {
            .kanban-board {
                grid-template-columns: 1fr;
            }
            .kanban-column {
                min-height: 250px;
            }
            .navbar .form-control {
                width: 80px !important;
            }
            .admin-panel .add-user-form {
                flex-direction: column;
            }
            .admin-panel .add-user-form input,
            .admin-panel .add-user-form select {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <!-- ===== ШАПКА ===== -->
    <header>
        <nav class="navbar navbar-expand-lg">
            <div class="container-fluid">
                <a class="navbar-brand" href="#">📋 Awesome Kanban Board</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarSupportedContent">
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                        <li class="nav-item">
                            <a class="nav-link active" href="#">Home</a>
                        </li>
                    </ul>

                    <form id="app-login-form" class="d-flex" role="search">
                        <input class="form-control me-2" name="login" type="text" placeholder="Login" required>
                        <input class="form-control me-2" name="password" type="password" placeholder="Password" required>
                        <button class="btn btn-outline-light" type="submit">Sign In</button>
                    </form>

                    <div id="user-menu-container" style="display: none;">
                        <div class="user-menu-trigger" id="user-menu-trigger">
                            <div class="user-avatar" id="user-avatar">
                                <span class="avatar-text" id="avatar-text">A</span>
                            </div>
                            <span class="user-name" id="user-menu-name">Admin</span>
                            <span class="role-badge" id="user-role-badge">admin</span>
                            <svg class="dropdown-arrow" id="dropdown-arrow" width="10" height="10" viewBox="0 0 12 12">
                                <path d="M6 8L1 3L11 3L6 8Z" fill="rgba(255,255,255,0.5)"/>
                            </svg>
                        </div>
                        <ul class="user-dropdown-menu" id="user-dropdown-menu">
                            <li class="dropdown-item" id="menu-profile">
                                <span>👤 Profile</span>
                                <span class="role-tag" id="menu-role-tag">admin</span>
                            </li>
                            <li class="dropdown-item" id="menu-mytasks">📋 My tasks</li>
                            <li class="dropdown-divider"></li>
                            <li class="dropdown-item" id="user-logout-btn">🚪 Log Out</li>
                        </ul>
                    </div>
                </div>
            </div>
        </nav>
    </header>

    <!-- ===== ОСНОВНОЙ КОНТЕНТ ===== -->
    <main class="container-fluid mt-2">
        <section id="alert-container"></section>

        <section id="content">

            <div id="kanban-board" style="display: none !important;">
                <header class="kanban-header">
                    <h1>📋 Awesome Kanban Board</h1>
                    <div class="stats">
                        <span class="stat-item">
                            <span class="stat-label">Active tasks:</span>
                            <span class="stat-value" id="active-tasks-count">0</span>
                        </span>
                        <span class="stat-item">
                            <span class="stat-label">Finished tasks:</span>
                            <span class="stat-value" id="finished-tasks-count">0</span>
                        </span>
                        <span class="stat-item">
                            <span class="stat-label">👤</span>
                            <span class="stat-value" id="user-name">User</span>
                        </span>
                    </div>
                </header>

                <div class="kanban-board">

                    <!-- BACKLOG -->
                    <section class="kanban-column" data-column="backlog">
                        <header class="column-header">
                            <h2 class="column-title">Backlog</h2>
                            <span class="task-count" id="backlog-count">0</span>
                        </header>
                        <div class="task-list" id="backlog-tasks"></div>
                        <footer class="column-footer">
                            <button class="add-task-btn" id="add-backlog-btn" disabled>+ Add card</button>
                        </footer>
                    </section>

                    <!-- READY -->
                    <section class="kanban-column" data-column="ready">
                        <header class="column-header">
                            <h2 class="column-title">Ready</h2>
                            <span class="task-count" id="ready-count">0</span>
                        </header>
                        <div class="task-list" id="ready-tasks"></div>
                        <footer class="column-footer">
                            <button class="add-task-btn" id="add-ready-btn" disabled>+ Add card</button>
                        </footer>
                    </section>

                    <!-- IN PROGRESS -->
                    <section class="kanban-column" data-column="inprogress">
                        <header class="column-header">
                            <h2 class="column-title">In Progress</h2>
                            <span class="task-count" id="inprogress-count">0</span>
                        </header>
                        <div class="task-list" id="inprogress-tasks"></div>
                        <footer class="column-footer">
                            <button class="add-task-btn" id="add-inprogress-btn" disabled>+ Add card</button>
                        </footer>
                    </section>

                    <!-- FINISHED -->
                    <section class="kanban-column" data-column="finished">
                        <header class="column-header">
                            <h2 class="column-title">Finished</h2>
                            <span class="task-count" id="finished-count">0</span>
                        </header>
                        <div class="task-list" id="finished-tasks"></div>
                        <footer class="column-footer">
                            <button class="add-task-btn" id="add-finished-btn" disabled>+ Add card</button>
                        </footer>
                    </section>

                </div>

                <!-- ===== АДМИН ПАНЕЛЬ ===== -->
                <div id="admin-panel" style="display: none;" class="admin-panel">
                    <h3>👥 Управление пользователями</h3>
                    <div class="user-list" id="user-list"></div>
                    <div class="add-user-form">
                        <input type="text" id="new-user-login" placeholder="Логин" />
                        <input type="password" id="new-user-password" placeholder="Пароль" />
                        <select id="new-user-role">
                            <option value="user">Пользователь</option>
                            <option value="admin">Администратор</option>
                        </select>
                        <button class="btn-add-user" id="btn-add-user">➕ Добавить</button>
                    </div>
                </div>

            </div>

            <p id="login-message" class="text-center fs-4" style="color: #ffffff; text-shadow: 0 2px 4px rgba(0,0,0,0.2);">Please Sign In to see your tasks!</p>

        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js">
    </script>
    <script type="module" src="app.js"></script>

</body>

</html>
